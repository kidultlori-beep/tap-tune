<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfd7ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Finger Garden / 手势花园 — pinch to sow flowers over a live camera garden."
    />
    <title>Finger Garden · 手势花园</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🌸%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <!-- MediaPipe Hands + camera utils: classic script tags → window.Hands / window.Camera -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
      crossorigin="anonymous"
    ></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <video id="camera" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="garden-canvas" aria-hidden="true"></canvas>
        <div id="fx-root"></div>
        <div id="emoji-layer"></div>
        <div id="notes-layer"></div>
        <div id="critters-layer"></div>
      </div>

      <header id="hud" hidden>
        <div class="pill" aria-live="polite">绽放 <strong id="bloom-count">0</strong></div>
        <button id="btn-mute" class="icon-btn" type="button" aria-label="静音">🔊</button>
      </header>

      <div id="toast" role="status"></div>
      <div id="demo-dock" hidden></div>

      <section id="start-screen">
        <div class="petal-drift" aria-hidden="true">
          <span>🌸</span><span>🌼</span><span>🌺</span><span>🍃</span><span>🌷</span>
        </div>
        <div class="start-card" id="start-card">
          <h1 class="brand-en">Finger Garden</h1>
          <p class="brand-zh">手势花园</p>
          <p class="lede">捏合拇指与手指播种</p>
          <p class="sub">
            八根手指，八种花与音符。对准镜头轻轻一捏，种子落下，花开风起。
            摄像头仅在本地使用，需要 HTTPS 或 localhost。
          </p>
          <p id="fallback-copy" hidden></p>
          <div class="actions" id="start-actions">
            <button id="btn-start" class="primary" type="button">进入花园</button>
            <button id="btn-demo" class="ghost" type="button">演示模式</button>
            <button id="btn-retry" class="retry" type="button" hidden>重试摄像头</button>
          </div>
          <p id="start-status"></p>
        </div>
      </section>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
