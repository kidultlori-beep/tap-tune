<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfd7ea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Finger Garden — pinch your fingers to plant a living emoji garden over the camera."
    />
    <title>Finger Garden</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🌸%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <!-- MediaPipe Hands + camera utils: classic script tags → window.Hands / window.Camera -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <video id="camera" class="is-front" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="beauty" hidden></canvas>
        <div id="pile-layer"></div>
        <div id="emoji-layer"></div>
        <div id="notes-layer"></div>
        <div id="critters-layer"></div>
      </div>

      <header id="hud" hidden>
        <div class="hud-left">
          <div class="pill" aria-live="polite">Bloom <strong id="bloom-count">0</strong></div>
          <button
            id="btn-beauty"
            class="pill beauty-toggle is-on"
            type="button"
            aria-pressed="true"
            aria-label="Beauty filter on"
          >
            ✨ <span class="beauty-label">Beauty</span>
          </button>
        </div>
        <div class="hud-actions">
          <button id="btn-flip" class="icon-btn" type="button" aria-label="Flip camera">🔄</button>
          <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute">🔊</button>
        </div>
      </header>

      <div id="toast" role="status"></div>
      <a
        id="x-link"
        href="https://x.com/annieway2026"
        target="_blank"
        rel="noopener noreferrer"
        >@annieway2026</a
      >

      <section id="start-screen">
        <div class="petal-drift" aria-hidden="true">
          <span>🌸</span><span>🌼</span><span>🌱</span><span>🍃</span><span>🍄</span>
        </div>
        <div class="start-card" id="start-card">
          <h1 class="brand-en">Finger Garden</h1>
          <p class="lede">Pinch thumb and fingertip to plant</p>
          <p class="sub">
            Eight fingers, eight notes. A plant falls, grows a thin stem, then fades with sparkles.
            Camera stays on your device. Open this page over HTTPS on a phone.
          </p>
          <p id="fallback-copy" hidden></p>
          <div class="actions" id="start-actions">
            <button id="btn-start" class="primary" type="button">Enter garden</button>
            <button id="btn-retry" class="retry" type="button" hidden>Retry camera</button>
          </div>
          <p class="lab-entry-wrap">
            <a class="lab-entry" href="beauty-lab.html">Beauty lab</a>
          </p>
          <p id="start-status"></p>
        </div>
      </section>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
